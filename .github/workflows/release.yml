name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Resolve Release Version
        id: version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            execSync("git fetch --tags --force", { stdio: "inherit" });
            const parseSemver = (raw) => {
              const m = String(raw).trim().replace(/^v/, "").match(/^(\d+)\.(\d+)\.(\d+)$/);
              return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
            };
            const cmpSemver = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            const fmtSemver = (v) => `${v[0]}.${v[1]}.${v[2]}`;
            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            const pkgVer = parseSemver(pkg.version) || [0, 1, 0];
            const headTags = execSync("git tag --points-at HEAD --list \"v*\"", { encoding: "utf8" })
              .split(/\r?\n/).map(parseSemver).filter(Boolean);
            const rawTags = execSync("git tag --list \"v*\"", { encoding: "utf8" })
              .split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
            const existingTagSet = new Set(rawTags);
            const tagSemvers = rawTags.map(parseSemver).filter(Boolean);
            const ref = process.env.GITHUB_REF || "";
            let resolved = pkgVer;
            if (ref.startsWith("refs/tags/v")) {
              resolved = parseSemver(ref.slice("refs/tags/".length)) || pkgVer;
            } else if (headTags.length > 0) {
              resolved = headTags.sort(cmpSemver).pop();
            } else {
              let highest = pkgVer;
              for (const tv of tagSemvers) {
                if (cmpSemver(tv, highest) > 0) highest = tv;
              }
              if (existingTagSet.has("v" + fmtSemver(highest))) {
                highest = [highest[0], highest[1], highest[2] + 1];
              }
              resolved = highest;
            }
            const versionStr = fmtSemver(resolved);
            const tagStr = "v" + versionStr;
            pkg.version = versionStr;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
            const outPath = process.env.GITHUB_OUTPUT;
            if (outPath) {
              fs.appendFileSync(outPath, `version=${versionStr}\ntag=${tagStr}\n`);
            }
            console.log(`Resolved release version: ${tagStr}`);
          '

      - name: Run Test Suite
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Package Portable Windows Desktop Application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows
          Copy-Item -Recurse -Force dist build/windows/dist
          Copy-Item -Recurse -Force electron build/windows/electron
          Copy-Item package.json build/windows/package.json
          Compress-Archive -Path build/windows/* -DestinationPath build/OpenRecipeBook-Windows-Portable.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: build/OpenRecipeBook-Windows-Portable.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Install Dependencies
        run: npm ci

      - name: Resolve Release Version
        id: version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            execSync("git fetch --tags --force", { stdio: "inherit" });
            const parseSemver = (raw) => {
              const m = String(raw).trim().replace(/^v/, "").match(/^(\d+)\.(\d+)\.(\d+)$/);
              return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
            };
            const cmpSemver = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            const fmtSemver = (v) => `${v[0]}.${v[1]}.${v[2]}`;
            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            const pkgVer = parseSemver(pkg.version) || [0, 1, 0];
            const headTags = execSync("git tag --points-at HEAD --list \"v*\"", { encoding: "utf8" })
              .split(/\r?\n/).map(parseSemver).filter(Boolean);
            const rawTags = execSync("git tag --list \"v*\"", { encoding: "utf8" })
              .split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
            const existingTagSet = new Set(rawTags);
            const tagSemvers = rawTags.map(parseSemver).filter(Boolean);
            const ref = process.env.GITHUB_REF || "";
            let resolved = pkgVer;
            if (ref.startsWith("refs/tags/v")) {
              resolved = parseSemver(ref.slice("refs/tags/".length)) || pkgVer;
            } else if (headTags.length > 0) {
              resolved = headTags.sort(cmpSemver).pop();
            } else {
              let highest = pkgVer;
              for (const tv of tagSemvers) {
                if (cmpSemver(tv, highest) > 0) highest = tv;
              }
              if (existingTagSet.has("v" + fmtSemver(highest))) {
                highest = [highest[0], highest[1], highest[2] + 1];
              }
              resolved = highest;
            }
            const versionStr = fmtSemver(resolved);
            const tagStr = "v" + versionStr;
            pkg.version = versionStr;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
            const gradlePath = "android/app/build.gradle";
            if (fs.existsSync(gradlePath)) {
              const code = resolved[0] * 10000 + resolved[1] * 100 + resolved[2];
              let gradle = fs.readFileSync(gradlePath, "utf8");
              gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${code}`);
              gradle = gradle.replace(/versionName\s+"[^"]*"/, `versionName "${versionStr}"`);
              fs.writeFileSync(gradlePath, gradle);
            }
            const outPath = process.env.GITHUB_OUTPUT;
            if (outPath) {
              fs.appendFileSync(outPath, `version=${versionStr}\ntag=${tagStr}\n`);
            }
            console.log(`Resolved release version: ${tagStr}`);
          '

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: Build Android APK
        run: |
          cd android
          gradle assembleRelease

      - name: Prepare APK Package
        run: |
          mkdir -p build
          cp android/app/build/outputs/apk/release/app-release.apk build/OpenRecipeBook-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: build/OpenRecipeBook-Android.apk

  publish-release:
    needs: [build-windows, build-android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve Release Version
        id: version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            execSync("git fetch --tags --force", { stdio: "inherit" });
            const parseSemver = (raw) => {
              const m = String(raw).trim().replace(/^v/, "").match(/^(\d+)\.(\d+)\.(\d+)$/);
              return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
            };
            const cmpSemver = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            const fmtSemver = (v) => `${v[0]}.${v[1]}.${v[2]}`;
            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            const pkgVer = parseSemver(pkg.version) || [0, 1, 0];
            const headTags = execSync("git tag --points-at HEAD --list \"v*\"", { encoding: "utf8" })
              .split(/\r?\n/).map(parseSemver).filter(Boolean);
            const rawTags = execSync("git tag --list \"v*\"", { encoding: "utf8" })
              .split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
            const existingTagSet = new Set(rawTags);
            const tagSemvers = rawTags.map(parseSemver).filter(Boolean);
            const ref = process.env.GITHUB_REF || "";
            let resolved = pkgVer;
            if (ref.startsWith("refs/tags/v")) {
              resolved = parseSemver(ref.slice("refs/tags/".length)) || pkgVer;
            } else if (headTags.length > 0) {
              resolved = headTags.sort(cmpSemver).pop();
            } else {
              let highest = pkgVer;
              for (const tv of tagSemvers) {
                if (cmpSemver(tv, highest) > 0) highest = tv;
              }
              if (existingTagSet.has("v" + fmtSemver(highest))) {
                highest = [highest[0], highest[1], highest[2] + 1];
              }
              resolved = highest;
            }
            const versionStr = fmtSemver(resolved);
            const tagStr = "v" + versionStr;
            pkg.version = versionStr;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
            const outPath = process.env.GITHUB_OUTPUT;
            if (outPath) {
              fs.appendFileSync(outPath, `version=${versionStr}\ntag=${tagStr}\n`);
            }
            console.log(`Resolved release version: ${tagStr}`);
          '

      - name: Create Build Directory
        run: mkdir -p build

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: build

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-package
          path: build

      - name: Generate Checksums
        run: |
          cd build
          sha256sum OpenRecipeBook-Windows-Portable.zip OpenRecipeBook-Android.apk > SHA256SUMS.txt

      - name: Tag Release
        if: startsWith(github.ref, 'refs/heads/main')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.version.outputs.tag }} ${{ github.sha }}
          git push -f origin ${{ steps.version.outputs.tag }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenRecipeBook ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: "true"
          files: |
            build/OpenRecipeBook-Windows-Portable.zip
            build/OpenRecipeBook-Android.apk
            build/SHA256SUMS.txt
          generate_release_notes: true
