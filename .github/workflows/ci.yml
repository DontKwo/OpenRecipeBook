name: CI & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenRecipeBook
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Clone ai-dev-tools
        shell: bash
        run: git clone --depth 1 https://github.com/DontKwo/ai-dev-tools.git "${{ runner.temp }}/_aitools"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Run Strict Linter and Link Check
        shell: bash
        run: |
          if ! uv run --no-project python "${{ runner.temp }}/_aitools/scripts/claudemd_linter.py" . --level strict --full --no-cache; then
            cat "${{ runner.temp }}/_aitools/scripts"/lint_report_*.txt || true
            exit 1
          fi
          uv run --no-project python "${{ runner.temp }}/_aitools/scripts/link_checker.py" .

  build-windows:
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Windows Desktop Executable
        run: |
          npm run build:desktop
          .\build\OpenRecipeBook-Windows.exe --self-test
          node scripts/verify_desktop_exe.cjs

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: build/OpenRecipeBook-Windows.exe

  build-macos:
    needs: lint-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build macOS Desktop Package
        run: |
          npm run build
          node scripts/build_desktop_unix.cjs --platform macos --self-test

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: build/OpenRecipeBook-macOS.zip

  build-linux:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build Linux Desktop Package
        run: |
          npm run build
          node scripts/build_desktop_unix.cjs --platform linux --self-test

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: build/OpenRecipeBook-Linux.tar.gz

  build-android:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Install Dependencies
        run: npm ci

      - name: Resolve Release Version
        id: version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            execSync("git fetch --tags --force", { stdio: "inherit" });
            const parseSemver = (raw) => {
              const m = String(raw).trim().replace(/^v/, "").match(/^(\d+)\.(\d+)\.(\d+)$/);
              return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
            };
            const cmpSemver = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            const fmtSemver = (v) => `${v[0]}.${v[1]}.${v[2]}`;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const pkgVer = parseSemver(pkg.version) || [0, 1, 0];
            const tagSemvers = execSync("git tag --list \"v*\"", { encoding: "utf8" })
              .split(/\r?\n/).map(parseSemver).filter(Boolean);
            let highest = pkgVer;
            for (const tv of tagSemvers) {
              if (cmpSemver(tv, highest) > 0) highest = tv;
            }
            const nextVer = [highest[0], highest[1], highest[2] + 1];
            const versionStr = fmtSemver(nextVer);
            const code = nextVer[0] * 10000 + nextVer[1] * 100 + nextVer[2];
            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${code}`);
            gradle = gradle.replace(/versionName\s+"[^"]*"/, `versionName "${versionStr}"`);
            fs.writeFileSync(gradlePath, gradle);
          '

      - name: Build and Sync Web Assets
        run: |
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: Configure Keystore and Build Signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          cd android
          gradle assembleRelease
          rm -f app/release-keystore.jks
          CERT_INFO=$(keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk)
          echo "$CERT_INFO"
          if echo "$CERT_INFO" | grep -q "CN=Android Debug"; then
            echo "ERROR: Debug signature detected" >&2
            exit 1
          fi
          if ! echo "$CERT_INFO" | grep -q "CN=OpenRecipeBook"; then
            echo "ERROR: Missing CN=OpenRecipeBook certificate" >&2
            exit 1
          fi

      - name: Prepare Android APK Artifact
        run: |
          mkdir -p build
          cp android/app/build/outputs/apk/release/app-release.apk build/OpenRecipeBook-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: build/OpenRecipeBook-Android.apk

  release:
    needs: [build-windows, build-macos, build-linux, build-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute Next SemVer Release Tag
        id: version
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            execSync("git fetch --tags --force", { stdio: "inherit" });
            const parseSemver = (raw) => {
              const m = String(raw).trim().replace(/^v/, "").match(/^(\d+)\.(\d+)\.(\d+)$/);
              return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
            };
            const cmpSemver = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            const fmtSemver = (v) => `${v[0]}.${v[1]}.${v[2]}`;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const pkgVer = parseSemver(pkg.version) || [0, 1, 0];
            const rawTags = execSync("git tag --list \"v*\"", { encoding: "utf8" })
              .split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
            let highest = pkgVer;
            for (const t of rawTags) {
              const tv = parseSemver(t);
              if (tv && cmpSemver(tv, highest) > 0) highest = tv;
            }
            const nextVer = rawTags.includes("v" + fmtSemver(highest))
              ? [highest[0], highest[1], highest[2] + 1]
              : highest;
            const tag = "v" + fmtSemver(nextVer);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
            console.log(`Publishing release ${tag}`);
          '

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect Release Assets
        run: |
          mkdir -p dist-release
          cp artifacts/windows-package/OpenRecipeBook-Windows.exe dist-release/
          cp artifacts/macos-package/OpenRecipeBook-macOS.zip dist-release/
          cp artifacts/linux-package/OpenRecipeBook-Linux.tar.gz dist-release/
          cp artifacts/android-package/OpenRecipeBook-Android.apk dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenRecipeBook ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          files: |
            dist-release/OpenRecipeBook-Windows.exe
            dist-release/OpenRecipeBook-macOS.zip
            dist-release/OpenRecipeBook-Linux.tar.gz
            dist-release/OpenRecipeBook-Android.apk
